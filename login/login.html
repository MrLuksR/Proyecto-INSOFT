
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>INADI | Iniciar sesión</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main class="login">

        <section class="formulario">

            <div class="titulo">

                <span class="etiqueta">
                    INADI
                </span>

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Ingresá con tu nombre de usuario y contraseña.
                </p>

            </div>

            <form action="login.php" method="POST">

                <!-- NOMBRE DE USUARIO -->

                <div class="campo">

                    <label for="nombre_usuario">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        id="nombre_usuario"
                        name="nombre_usuario"
                        placeholder="Ingresá tu nombre de usuario"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresá tu contraseña"
                        required
                    >

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="boton"
                >
                    INICIAR SESIÓN
                </button>

            </form>

        </section>

    </main>

</body>

</html>
